<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Livro - Livraria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Livraria
        </div>

        <div class="menu">
            <a href="principal.html">Início</a>

            <div class="dropdown">
                <a href="#">Livros ▾</a>

                <div class="dropdown-menu">
                    <a href="livros.html">Ver livros</a>
                    <a href="cadastro-livro.html">Cadastrar livro</a>
                </div>
            </div>

            <div class="dropdown">
                <a href="#">Autores ▾</a>

                <div class="dropdown-menu">
                    <a href="autores.html">Ver autores</a>
                    <a href="cadastro-autor.html">Cadastrar autor</a>
                </div>
            </div>

            <a href="index.html">Deslogar</a>
        </div>

    </nav>

    <main class="pagina">

        <div class="formulario">

            <h1>Cadastrar livro</h1>

            <form>

                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo">

                <label for="autor">Autor</label>
                <select id="autor" name="autor">
                    <option value="">Selecione um autor</option>
                    <option value="1">Machado de Assis</option>
                    <option value="2">Antoine de Saint-Exupéry</option>
                </select>

                <label for="editora">Editora</label>
                <input type="text" id="editora" name="editora">

                <label for="ano">Ano de publicação</label>
                <input type="number" id="ano" name="ano">


                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade">

                <label for="preco">Preço</label>
                <input type="number" step="0.01" id="preco" name="preco">

                <button type="submit">Cadastrar livro</button>

            </form>

        </div>

    </main>

</body>
</html>
